name: Deploy

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Builds the relay and viewer images for the destiny-ascension cluster's arm64 nodes and pins them in deploy/ with a
# commit to main, which deploys them: Flux on the cluster applies deploy/ from main.
# Neither image runs anything while it is built, so the x64 runner builds them without emulation.
jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      server: ${{ steps.server.outputs.digest }}
      web: ${{ steps.web.outputs.digest }}
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/gradle-daemon-jvm.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - id: server
        name: Publish the relay image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./gradlew :server:publishImage -Prelease.version="${TAG#v}"
          echo "digest=$(cat server/build/jib-image.digest)" >> "$GITHUB_OUTPUT"
      - name: Build the viewer
        run: |
          ./gradlew :app:sharedLogic:jsBrowserDevelopmentLibraryDistribution
          npm ci --ignore-scripts
          npm run build
      - id: web
        name: Publish the viewer image
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/nols1000/hashiru-web
        run: |
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
          docker build --platform linux/arm64 --tag "$IMAGE:${TAG#v}" app/webApp
          docker push "$IMAGE:${TAG#v}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${TAG#v}")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
          docker logout ghcr.io

  pin:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SERVER: ${{ needs.images.outputs.server }}
      WEB: ${{ needs.images.outputs.web }}
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Pin the images on main
        run: |
          sed -i \
            -e "/newName: ghcr.io\/nols1000\/hashiru-server$/{n;s/digest: .*/digest: $SERVER/}" \
            -e "/newName: ghcr.io\/nols1000\/hashiru-web$/{n;s/digest: .*/digest: $WEB/}" \
            deploy/kustomization.yaml
          git diff --exit-code --quiet deploy/kustomization.yaml && { echo "Already deployed"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "deploy: $VERSION" --message "Images built by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          remote="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          # main may have moved on while the images were built
          git push "$remote" HEAD:main || { git pull --rebase "$remote" main && git push "$remote" HEAD:main; }
