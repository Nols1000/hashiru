# The viewer's static files.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hashiru-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hashiru-web
  template:
    metadata:
      labels:
        app: hashiru-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: hashiru-web
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # nginx's pid file and caches
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hashiru-web
spec:
  selector:
    app: hashiru-web
  ports:
    - port: 80
      targetPort: 8080
