# What Flux applies to the destiny-ascension cluster (../destiny-ascension-infra), into namespace `hashiru`.
# `${HASHIRU_HOST}` comes from the cluster. The Deploy workflow commits the digests below, which deploys them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - server.yaml
  - web.yaml
  - route.yaml
images:
  - name: hashiru-server
    newName: ghcr.io/nols1000/hashiru-server
    digest: sha256:56e14e4d24edb2f9786dcb2f27a2a8a0b9b145a015a4f0ab1525cf2f3b6d32c8
  - name: hashiru-web
    newName: ghcr.io/nols1000/hashiru-web
    digest: sha256:041ddf3af8614de38c00d6ffaa0eabe444656e2ce7f1f25afe5411e64f1193e9
