# What Flux applies to the destiny-ascension cluster (../destiny-ascension-infra), into namespace `hashiru`.
# `${HASHIRU_HOST}` comes from the cluster. The Deploy workflow commits the digests below, which deploys them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - server.yaml
  - web.yaml
  - route.yaml
images:
  - name: hashiru-server
    newName: ghcr.io/nols1000/hashiru-server
    digest: sha256:5beeafb4b8987d48a77d1380e495eee43a78ef81bff23aa33b4db23dd20a7e6c
  - name: hashiru-web
    newName: ghcr.io/nols1000/hashiru-web
    digest: sha256:1a665f14b7a1e7cd0ed14c8d058be5204a5578f251e435ac6173d0c824757393
