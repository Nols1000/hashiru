# One origin for both: the viewer calls the relay's API as `/api`. Nothing else of the relay is public.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hashiru
spec:
  parentRefs:
    - kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - ${HASHIRU_HOST}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: hashiru-server
          port: 80
    - backendRefs:
        - name: hashiru-web
          port: 80
