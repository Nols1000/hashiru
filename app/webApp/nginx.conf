# Serves the built viewer. The share is in the link's fragment, which browsers never send, so every page is the
# same and nothing here learns which share someone opens. Nothing is logged.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log off;

    # The rest of the content security policy is in the page; a frame ancestor can't be set there.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = / {
        add_header Cache-Control no-cache always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files /index.html =404;
    }

    # Named after their content by Vite, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        # MapLibre's worker, which the stock mime.types does not know; a module worker must be served as JavaScript.
        location ~ \.mjs$ {
            types { }
            default_type text/javascript;
        }
    }
}
